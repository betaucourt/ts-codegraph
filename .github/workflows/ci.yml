name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack & pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build TypeScript
        run: pnpm run build

      - name: Verify Documentation Drift
        run: |
          node dist/bin/ts-codegraph.js load .
          node dist/bin/ts-codegraph.js generate --template all --out-dir ./docs/generated
          git diff -I "snapshot:v1:" -I "source_snapshot" --exit-code docs/generated/packages
